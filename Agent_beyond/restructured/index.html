<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beyond the Age of AI Agents - Restructured Deck</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-2: #eef3fb;
      --text: #18212f;
      --muted: #5f6f85;
      --accent: #2563eb;
      --accent-2: #38bdf8;
      --border: #d5deea;
      --shadow: rgba(32, 53, 84, 0.12);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 24%),
        radial-gradient(circle at top right, rgba(37, 99, 235, 0.12), transparent 18%),
        linear-gradient(180deg, #f8fbff 0%, #eef4fb 100%);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto auto;
      align-items: end;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      z-index: 20;
    }

    .title {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .title-main {
      font-weight: 700;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title-sub {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button, select {
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      color: var(--text);
      padding: 0 10px;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 255, 255, 0.7) inset;
    }

    button:hover, select:hover {
      border-color: #8eb5f8;
    }

    button.primary {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border: none;
      color: white;
      font-weight: 600;
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.24);
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      white-space: nowrap;
    }

    .viewer-wrap {
      flex: 1;
      overflow: auto;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .canvas {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 24px 44px var(--shadow);
      background: #ffffff;
      transform-origin: top left;
      flex: 0 0 auto;
    }

    iframe {
      width: 1280px;
      height: 720px;
      border: 0;
      display: block;
      background: #ffffff;
    }

    @media (max-width: 900px) {
      .topbar {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .title,
      .meta {
        text-align: center;
      }

      .controls {
        justify-content: center;
      }

      button, select {
        height: 36px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title">
      <div class="title-main">Beyond the Age of AI Agents</div>
      <div class="title-sub">14-slide consolidated deck focused on organizational change, university AX, leadership, labor, and roadmap</div>
    </div>
    <div class="controls">
      <button id="prevBtn">Prev</button>
      <button id="nextBtn" class="primary">Next</button>
      <select id="slideSelect" aria-label="Slide selection"></select>
      <button id="zoomOutBtn">A-</button>
      <button id="fitBtn">Fit</button>
      <button id="zoomInBtn">A+</button>
      <button id="fullscreenBtn">Fullscreen</button>
    </div>
    <div class="meta" id="metaText"></div>
  </div>

  <div class="viewer-wrap" id="viewerWrap">
    <div class="canvas" id="canvas">
      <iframe id="slideFrame" title="Restructured slides"></iframe>
    </div>
  </div>

  <script>
    const BASE_W = 1280;
    const BASE_H = 720;
    const slides = [
      { label: "1. Cover", src: "../beyond_ai_agents_20260405102911_slide1.html?v=20260510a", origin: "original slide 1" },
      { label: "2. Why This Shift Matters: From LLMs to Agent Systems", src: "../beyond_ai_agents_20260405102911_slide2.html?v=20260510a", origin: "original slide 2" },
      { label: "3. Why Organizations Still Struggle to Use AI Well", src: "../beyond_ai_agents_20260405102911_slide9.html?v=20260510a", origin: "original slide 9" },
      { label: "4. From AI Adoption to AI-Ready Organizations", src: "../beyond_ai_agents_20260405102911_slide11.html?v=20260510a", origin: "original slide 11" },
      { label: "5. Human + Agent Teaming and Organizational Change", src: "../beyond_ai_agents_20260405102911_slide12.html?v=20260510a", origin: "original slide 12" },
      { label: "6. Leadership, Governance, and AI Agents with Leadership", src: "leadership_agents.html?v=20260510a", origin: "new integrated slide" },
      { label: "7. The AI-Native Campus Vision", src: "../beyond_ai_agents_20260405102911_slide17.html?v=20260510a", origin: "original slide 17" },
      { label: "8. University AX in Practice", src: "university_ax_summary.html?v=20260510a", origin: "new integrated slide" },
      { label: "9. Risks, Limits, and Trust", src: "risks_trust.html?v=20260510a", origin: "new integrated slide" },
      { label: "10. What Comes After Today's Agents", src: "../beyond_ai_agents_20260405102911_slide26.html?v=20260510a", origin: "original slide 26" },
      { label: "11. The Future of Work: Skills, Labor, and Managed Agent Systems", src: "future_work_leadership.html?v=20260510a", origin: "new integrated slide" },
      { label: "12. Strategic Roadmap", src: "../beyond_ai_agents_20260405102911_slide31.html?v=20260510a", origin: "original slide 31" },
      { label: "13. Call to Action", src: "../beyond_ai_agents_20260405102911_slide32.html?v=20260510a", origin: "original slide 32" }
    ];

    const frame = document.getElementById("slideFrame");
    const select = document.getElementById("slideSelect");
    const metaText = document.getElementById("metaText");
    const viewerWrap = document.getElementById("viewerWrap");
    const canvas = document.getElementById("canvas");

    const isMobile = window.matchMedia("(max-width: 900px)").matches;
    let idx = 0;
    let userZoom = isMobile ? 1.35 : 1.0;

    function renderOptions() {
      select.innerHTML = "";
      slides.forEach((slide, i) => {
        const opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = slide.label;
        select.appendChild(opt);
      });
    }

    function getFitScale() {
      const pad = 8;
      const vw = Math.max(320, viewerWrap.clientWidth - pad * 2);
      const vh = Math.max(180, viewerWrap.clientHeight - pad * 2);
      return Math.min(vw / BASE_W, vh / BASE_H);
    }

    function applyScale() {
      const fit = getFitScale();
      const scale = fit * userZoom;
      canvas.style.width = `${BASE_W * scale}px`;
      canvas.style.height = `${BASE_H * scale}px`;
      frame.style.transformOrigin = "top left";
      frame.style.transform = `scale(${scale})`;
      frame.style.width = `${BASE_W}px`;
      frame.style.height = `${BASE_H}px`;
      updateMeta();
    }

    function updateMeta() {
      const slide = slides[idx];
      metaText.textContent = `${idx + 1}/${slides.length} | ${slide.origin} | zoom ${Math.round(userZoom * 100)}%`;
      document.title = `${slide.label} - Consolidated Deck`;
    }

    function setSlide(newIdx) {
      if (newIdx < 0 || newIdx >= slides.length) return;
      idx = newIdx;
      const slide = slides[idx];
      frame.src = slide.src;
      select.value = String(idx);
      updateMeta();
      history.replaceState(null, "", `#slide=${idx + 1}`);
    }

    function next() { setSlide(Math.min(idx + 1, slides.length - 1)); }
    function prev() { setSlide(Math.max(idx - 1, 0)); }

    function zoomIn() {
      userZoom = Math.min(2.4, +(userZoom + 0.1).toFixed(2));
      applyScale();
    }

    function zoomOut() {
      userZoom = Math.max(0.7, +(userZoom - 0.1).toFixed(2));
      applyScale();
    }

    function zoomFit() {
      userZoom = 1.0;
      applyScale();
    }

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (err) {
        console.error(err);
      }
    }

    document.getElementById("prevBtn").addEventListener("click", prev);
    document.getElementById("nextBtn").addEventListener("click", next);
    document.getElementById("zoomInBtn").addEventListener("click", zoomIn);
    document.getElementById("zoomOutBtn").addEventListener("click", zoomOut);
    document.getElementById("fitBtn").addEventListener("click", zoomFit);
    document.getElementById("fullscreenBtn").addEventListener("click", toggleFullscreen);
    select.addEventListener("change", (event) => setSlide(Number(event.target.value)));
    window.addEventListener("resize", applyScale);
    window.addEventListener("keydown", (event) => {
      if (["ArrowRight", "PageDown", " "].includes(event.key)) {
        event.preventDefault();
        next();
      } else if (["ArrowLeft", "PageUp"].includes(event.key)) {
        event.preventDefault();
        prev();
      } else if (event.key === "Home") {
        setSlide(0);
      } else if (event.key === "End") {
        setSlide(slides.length - 1);
      } else if (event.key === "+" || event.key === "=") {
        zoomIn();
      } else if (event.key === "-") {
        zoomOut();
      } else if (event.key === "0") {
        zoomFit();
      } else if (event.key.toLowerCase() === "f") {
        toggleFullscreen();
      }
    });

    renderOptions();
    setSlide(0);
    applyScale();
  </script>
</body>
</html>
