<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Public-Sector AX Execution Models</title>
  <style>
    :root {
      --bg: #f4f1ec;
      --paper: #fffaf2;
      --ink: #1f2a2e;
      --muted: #627077;
      --line: #d9d1c3;
      --blue: #225f73;
      --green: #54715f;
      --red: #a6533f;
      --gold: #bd8b35;
      --shadow: 0 22px 54px rgba(36, 45, 48, 0.14);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      background:
        linear-gradient(120deg, rgba(34, 95, 115, 0.08), transparent 34%),
        linear-gradient(250deg, rgba(189, 139, 53, 0.13), transparent 32%),
        var(--bg);
      color: var(--ink);
      font-family: Inter, "Segoe UI", Arial, "Malgun Gothic", sans-serif;
    }

    .lang-switch {
      position: fixed;
      top: 14px;
      right: 18px;
      z-index: 7;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border: 1px solid rgba(31, 42, 46, 0.14);
      border-radius: 999px;
      background: rgba(255, 250, 242, 0.95);
      box-shadow: 0 12px 30px rgba(31, 42, 46, 0.12);
    }

    .lang-switch button {
      width: auto;
      height: 34px;
      min-width: 78px;
      padding: 0 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
    }

    .lang-switch button.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .deck {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      padding: 56px 18px 88px;
    }

    .slide {
      display: none;
      position: relative;
      width: min(1280px, 96vw, calc((100vh - 162px) * 1.7778));
      aspect-ratio: 16 / 9;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .slide.active { display: block; }

    .slide::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 7px;
      background: linear-gradient(90deg, var(--blue), var(--green), var(--gold), var(--red));
    }

    .inner {
      height: 100%;
      padding: clamp(30px, 3.2vw, 48px);
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow: auto;
    }

    .kicker {
      margin: 0;
      color: var(--blue);
      font-size: clamp(15px, 1.2vw, 18px);
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1,
    h2 {
      margin: 0;
      letter-spacing: 0;
      line-height: 1.07;
    }

    h1 {
      max-width: 980px;
      font-size: clamp(42px, 5vw, 72px);
    }

    h2 {
      max-width: 1100px;
      font-size: clamp(32px, 3.25vw, 50px);
    }

    p {
      margin: 0;
      font-size: clamp(17px, 1.45vw, 23px);
      line-height: 1.5;
    }

    ul {
      margin: 0;
      padding-left: 1.2em;
      font-size: clamp(16px, 1.18vw, 19px);
      line-height: 1.45;
    }

    li + li { margin-top: 6px; }

    .subtitle {
      max-width: 920px;
      color: var(--muted);
      font-size: clamp(21px, 1.9vw, 29px);
    }

    .presenter {
      max-width: 920px;
      padding-top: 4px;
      color: var(--blue);
      font-size: clamp(17px, 1.35vw, 22px);
      font-weight: 800;
      line-height: 1.45;
    }

    .grid {
      display: grid;
      gap: 15px;
    }

    .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .box {
      min-height: 100%;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.64);
    }

    .box h3 {
      margin: 0 0 9px;
      color: var(--blue);
      font-size: clamp(18px, 1.42vw, 24px);
      line-height: 1.18;
      letter-spacing: 0;
    }

    .box p,
    .box li {
      font-size: clamp(14px, 1.06vw, 18px);
      line-height: 1.4;
    }

    .quote {
      max-width: 1040px;
      padding-left: 21px;
      border-left: 6px solid var(--gold);
      color: #39464b;
      font-size: clamp(21px, 1.85vw, 30px);
      line-height: 1.36;
      font-weight: 760;
    }

    .hero-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.04fr) minmax(300px, 0.96fr);
      gap: 26px;
      align-items: center;
      min-height: 0;
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-width: 0;
    }

    .image-panel {
      min-height: 0;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      overflow: hidden;
      box-shadow: 0 16px 34px rgba(31, 42, 46, 0.11);
    }

    .image-panel img {
      display: block;
      width: 100%;
      height: 100%;
      aspect-ratio: 16 / 11;
      object-fit: cover;
    }

    .image-caption {
      padding: 10px 13px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      background: rgba(255, 250, 242, 0.94);
      border-top: 1px solid var(--line);
    }

    .split-visual {
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
      gap: 22px;
      align-items: center;
      min-height: 0;
    }

    .flow {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      align-items: stretch;
    }

    .step {
      position: relative;
      padding: 15px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .step::after {
      content: "";
      position: absolute;
      top: 50%;
      right: -10px;
      width: 10px;
      height: 2px;
      background: var(--line);
    }

    .step:last-child::after { display: none; }

    .step b {
      display: block;
      margin-bottom: 7px;
      color: var(--red);
      font-size: clamp(16px, 1.15vw, 20px);
    }

    .step span {
      display: block;
      color: var(--muted);
      font-size: clamp(13px, 0.95vw, 16px);
      line-height: 1.34;
    }

    .matrix {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: clamp(13px, 0.92vw, 17px);
      line-height: 1.3;
    }

    .matrix th,
    .matrix td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
    }

    .matrix th {
      background: rgba(34, 95, 115, 0.1);
      color: var(--blue);
      font-weight: 800;
    }

    .matrix tr:last-child td { border-bottom: 0; }

    html:lang(vi) .inner {
      padding: clamp(24px, 2.55vw, 38px);
      gap: 12px;
    }

    html:lang(vi) .kicker {
      font-size: clamp(12px, 0.92vw, 15px);
    }

    html:lang(vi) h1 {
      font-size: clamp(34px, 4vw, 58px);
      line-height: 1.08;
    }

    html:lang(vi) h2 {
      max-width: 1160px;
      font-size: clamp(25px, 2.45vw, 38px);
      line-height: 1.12;
    }

    html:lang(vi) p,
    html:lang(vi) ul {
      font-size: clamp(13px, 1vw, 17px);
      line-height: 1.34;
    }

    html:lang(vi) li + li { margin-top: 4px; }

    html:lang(vi) .grid {
      gap: 10px;
    }

    html:lang(vi) .box {
      padding: 11px 12px;
      min-width: 0;
    }

    html:lang(vi) .box h3 {
      margin-bottom: 6px;
      font-size: clamp(15px, 1.04vw, 19px);
      line-height: 1.12;
      overflow-wrap: anywhere;
    }

    html:lang(vi) .box p,
    html:lang(vi) .box li {
      font-size: clamp(11.5px, 0.82vw, 14px);
      line-height: 1.26;
      overflow-wrap: anywhere;
    }

    html:lang(vi) .quote {
      padding-left: 14px;
      border-left-width: 5px;
      font-size: clamp(15px, 1.18vw, 21px);
      line-height: 1.25;
    }

    html:lang(vi) .matrix {
      table-layout: fixed;
      font-size: clamp(10px, 0.72vw, 13px);
      line-height: 1.18;
    }

    html:lang(vi) .matrix th,
    html:lang(vi) .matrix td {
      padding: 6px 7px;
      overflow-wrap: anywhere;
      hyphens: auto;
    }

    html:lang(vi) .split-visual {
      grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr);
      gap: 16px;
    }

    html:lang(vi) .image-caption {
      padding: 8px 10px;
      font-size: 11px;
      line-height: 1.25;
    }

    .note {
      display: none;
      margin-top: auto;
      padding: 12px 14px;
      border-left: 5px solid var(--green);
      background: rgba(84, 113, 95, 0.1);
      color: #43514a;
      font-size: clamp(13px, 0.94vw, 16px);
      line-height: 1.42;
    }

    body.show-notes .note { display: block; }

    .controls {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 5;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid rgba(31, 42, 46, 0.14);
      border-radius: 999px;
      background: rgba(255, 250, 242, 0.94);
      box-shadow: 0 12px 34px rgba(31, 42, 46, 0.13);
    }

    button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fff;
      color: var(--ink);
      font-size: 22px;
      cursor: pointer;
    }

    button:hover { border-color: var(--blue); color: var(--blue); }

    .counter {
      min-width: 74px;
      text-align: center;
      color: var(--muted);
      font-weight: 800;
      font-size: 15px;
    }

    .footer {
      position: absolute;
      left: clamp(30px, 3.2vw, 48px);
      right: clamp(30px, 3.2vw, 48px);
      bottom: 18px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #879197;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .hero-layout,
      .split-visual { grid-template-columns: 1fr; }
      .image-panel img { aspect-ratio: 16 / 8; }
    }

    @media (max-width: 760px) {
      body { overflow: auto; }
      .lang-switch {
        left: 10px;
        right: 10px;
        justify-content: center;
      }
      .lang-switch button { min-width: 0; }
      .deck {
        height: auto;
        min-height: 100vh;
        padding: 70px 10px 76px;
      }
      .slide {
        width: 100%;
        min-height: calc(100vh - 148px);
        aspect-ratio: auto;
      }
      .inner { padding: 26px 20px 54px; }
      .cols-2,
      .cols-3,
      .cols-4,
      .flow { grid-template-columns: 1fr; }
      .step::after { display: none; }
      .footer { left: 20px; right: 20px; }
    }
  </style>
</head>
<body>
  <div class="lang-switch" aria-label="Language selection">

        {

          title: "AI 도입을 넘어 적응하고 학습하는 국가로",
          cols: 3,
          boxes: [

          quote: "미래의 목표는 자동화된 국가가 아니다. 더 빨리 배우고, 권리를 더 잘 보호하며, AI로 공공가치를 확장하는 유능한 국가다.",
          note: "이 마무리는 구체적 실행모델을 더 큰 개혁 비전과 다시 연결한다. 개발도상국은 AX를 단순한 업무 디지털화가 아니라 적응적이고 협력적이며 책임 있는 국가를 만드는 계기로 삼을 수 있다.",
          footer: "공공가치를 위한 적응형 국가"

    const deck = document.getElementById("deck");
    const counter = document.getElementById("counter");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const notes = document.getElementById("notes");
    const langButtons = Array.from(document.querySelectorAll("[data-lang]"));
    let current = 0;
    let slides = [];
    let currentLang = localStorage.getItem("axDeckLang") || "en";
    if (!slidesByLang[currentLang]) currentLang = "en";

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderList(items) {
      return `<ul>${items.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
    }

    function renderBox(box) {
      const body = box.items ? renderList(box.items) : `<p>${escapeHtml(box.text)}</p>`;
      return `<div class="box"><h3>${escapeHtml(box.title)}</h3>${body}</div>`;
    }

    function renderBoxes(slide) {
      return `<div class="grid cols-${slide.cols || 3}">${slide.boxes.map(renderBox).join("")}</div>`;
    }

    function renderTable(table) {
      return `
        <table class="matrix">
          <tr>${table.headers.map(header => `<th>${escapeHtml(header)}</th>`).join("")}</tr>
          ${table.rows.map(row => `<tr>${row.map(cell => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>`).join("")}
        </table>`;
    }

    function renderFlow(flow) {
      return `<div class="flow">${flow.map(step => `<div class="step"><b>${escapeHtml(step.label)}</b><span>${escapeHtml(step.text)}</span></div>`).join("")}</div>`;
    }

    function renderParagraphs(slide) {
      return (slide.paragraphs || []).map(text => `<p>${escapeHtml(text)}</p>`).join("");
    }

    function renderNote(slide) {
      return slide.note ? `<p class="note">${escapeHtml(slide.note)}</p>` : "";
    }

    function renderFooter(slide, index) {
      return `<div class="footer"><span>${escapeHtml(slide.footer)}</span><span>${index + 1}</span></div>`;
    }

    function renderSlide(slide, index) {
      if (slide.type === "hero") {
        return `
          <section class="slide${index === current ? " active" : ""}">
            <div class="inner">
              <div class="hero-layout">
                <div class="hero-copy">
                  <p class="kicker">${escapeHtml(slide.kicker)}</p>
                  <h1>${escapeHtml(slide.title)}</h1>
                  <p class="subtitle">${escapeHtml(slide.subtitle)}</p>
                  ${slide.presenter ? `<p class="presenter">${escapeHtml(slide.presenter)}</p>` : ""}
                </div>
                <figure class="image-panel">
                  <img src="${escapeHtml(slide.image)}" alt="${escapeHtml(slide.imageAlt)}" />
                  <figcaption class="image-caption">${escapeHtml(slide.caption)}</figcaption>
                </figure>
              </div>
              ${renderNote(slide)}
            </div>
            ${renderFooter(slide, index)}
          </section>`;
      }

      if (slide.type === "split") {
        return `
          <section class="slide${index === current ? " active" : ""}">
            <div class="inner">
              <div class="split-visual">
                <figure class="image-panel">
                  <img src="${escapeHtml(slide.image)}" alt="${escapeHtml(slide.imageAlt)}" />
                  <figcaption class="image-caption">${escapeHtml(slide.caption)}</figcaption>
                </figure>
                <div>
                  <p class="kicker">${escapeHtml(slide.kicker)}</p>
                  ${slide.title ? `<h2>${escapeHtml(slide.title)}</h2>` : ""}
                  ${renderList(slide.items)}
                </div>
              </div>
              ${renderNote(slide)}
            </div>
            ${renderFooter(slide, index)}
          </section>`;
      }

      return `
        <section class="slide${index === current ? " active" : ""}">
          <div class="inner">
            <p class="kicker">${escapeHtml(slide.kicker)}</p>
            ${slide.title ? `<h2>${escapeHtml(slide.title)}</h2>` : ""}
            ${slide.boxes ? renderBoxes(slide) : ""}
            ${slide.table ? renderTable(slide.table) : ""}
            ${slide.flow ? renderFlow(slide.flow) : ""}
            ${renderParagraphs(slide)}
            ${slide.quote ? `<p class="quote">${escapeHtml(slide.quote)}</p>` : ""}
            ${renderNote(slide)}
          </div>
          ${renderFooter(slide, index)}
        </section>`;
    }

    function showSlide(index) {
      slides = Array.from(document.querySelectorAll(".slide"));
      current = Math.max(0, Math.min(index, slides.length - 1));
      slides.forEach((slide, i) => slide.classList.toggle("active", i === current));
      counter.textContent = `${current + 1} / ${slides.length}`;
      const hash = `#${current + 1}`;
      if (location.hash !== hash) history.replaceState(null, "", hash);
    }

    function renderDeck(lang) {
      const meta = langMeta[lang];
      const data = slidesByLang[lang];
      document.documentElement.lang = meta.lang;
      document.title = meta.title;
      deck.innerHTML = data.map(renderSlide).join("");
      langButtons.forEach(button => button.classList.toggle("active", button.dataset.lang === lang));
      currentLang = lang;
      localStorage.setItem("axDeckLang", lang);
      if (current >= data.length) current = data.length - 1;
      showSlide(current);
    }

    langButtons.forEach(button => {
      button.addEventListener("click", () => renderDeck(button.dataset.lang));
    });

    prev.addEventListener("click", () => showSlide(current - 1));
    next.addEventListener("click", () => showSlide(current + 1));
    notes.addEventListener("click", () => document.body.classList.toggle("show-notes"));

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") showSlide(current + 1);
      if (event.key === "ArrowLeft" || event.key === "PageUp") showSlide(current - 1);
      if (event.key.toLowerCase() === "n") document.body.classList.toggle("show-notes");
      if (/^[0-9]$/.test(event.key)) {
        const target = Number(event.key);
        if (target > 0 && target <= slides.length) showSlide(target - 1);
      }
    });

    const initial = Number(location.hash.replace("#", ""));
    if (Number.isInteger(initial) && initial >= 1 && initial <= slidesByLang[currentLang].length) current = initial - 1;
    renderDeck(currentLang);
  </script>
